# gitleaks configuration for MonetizaClip.
#
# The stock rule set is kept as-is (`useDefault`). The only exception is the
# dummy credential quoted by the project plan to document this workflow's own
# test. It is allowlisted **by value, with no path exemption**: the regex is
# anchored to the plan's literal code span (backticks included) so it matches
# only that documented example. A real credential is still reported no matter
# which file it lands in -- including `plan.md` and `.superpowers/`.

[extend]
useDefault = true

[allowlist]
description = "Dummy credential quoted by the project plan to document the workflow's own test"
regexTarget = "line"
regexes = ['''`const KEY = "sk-test-[0-9]{6,}";`''']
