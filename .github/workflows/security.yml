name: Security

# Static analysis only: this workflow never builds the apps, never runs moon
# and never touches Rust. It deliberately has no `paths-ignore` -- a credential
# can land in a documentation-only change just as easily as in code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bumped together with the checksum below. The release binary is pinned as
  # tightly as an action SHA: version + sha256 of the official asset.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.184.0

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The job only reads the tree; no step pushes anything back.
          persist-credentials: false

      # gitleaks is fetched as the official release binary instead of using
      # `gitleaks/gitleaks-action`, whose v2 line requires a paid licence for
      # organisations. The asset is verified against the release checksum, so
      # the binary is pinned as tightly as an action SHA.
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        shell: bash
        # `dir` scans the checked-out tree (tracked files plus anything a step
        # created). `--redact` keeps a leaked value out of the job log; the
        # rule and file are still printed so the failure is actionable.
        run: gitleaks dir . --redact --exit-code 1 --no-banner --verbose

      - name: Reject VITE_ variables that look like secrets
        shell: bash
        # Vite inlines every VITE_* variable into the client bundle, so one
        # ending in KEY/SECRET/TOKEN/PASSWORD would ship to browsers. gitleaks
        # cannot catch a short value, hence this explicit guard.
        # `.env.example` is excluded because it is the committed template that
        # documents variable *names* only (no values) and is meant to list
        # them. Only the app trees are scanned: plan.md and other prose quote
        # the pattern on purpose and are never bundled.
        run: |
          set -euo pipefail
          if matches=$(grep -rInE \
              --exclude-dir=node_modules \
              --exclude-dir=dist \
              --exclude-dir=.wrangler \
              --exclude='.env.example' \
              'VITE_[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)' \
              apps/web apps/api); then
            echo "::error::A VITE_ variable that looks like a secret was found; Vite would inline it into the client bundle."
            echo "$matches"
            exit 1
          fi
          echo "No VITE_ secret-like variables in apps/web or apps/api."

  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Semgrep is installed from PyPI at an exact version. `semgrep ci` is not
      # used because it requires an AppSec Platform token; the official action
      # only wraps that command.
      - name: Install semgrep
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: semgrep scan
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --error \
            --exclude node_modules \
            --exclude apps/desktop

      # OSV-Scanner scans `apps/` only: the MVP is web-only and the Rust
      # workspace is out of scope for this task. Scanning `Cargo.lock` is
      # deliberately deferred -- go back to `./` and triage its RustSEC
      # advisories when desktop work resumes.
      # `osv-scanner.toml` triages the three known npm advisories with an
      # expiry date; an expired ignore makes OSV fail instead of hiding debt.
      # The SARIF is uploaded as a build artifact instead of to Code Scanning,
      # so the job needs no `security-events: write` permission and no GitHub
      # Advanced Security licence.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            --format=sarif
            --output-file=osv-results.sarif
            apps/

      - name: Upload OSV SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: warn
          retention-days: 5

  deps:
    name: Audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Matches the pin in .prototools.
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        working-directory: apps/${{ matrix.app }}
        run: bun audit --audit-level=high
